<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Order Placed - ShopNest</title>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    @keyframes pop { 0%{transform:scale(0)} 70%{transform:scale(1.15)} 100%{transform:scale(1)} }
    .success-icon { animation: pop 0.5s ease forwards; }
    @keyframes fadeUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
    .success-card > * { animation: fadeUp 0.5s ease forwards; }
  </style>
</head>
<body style="background:#f5f6fa;">

<nav class="navbar">
  <div class="navbar-inner">
    <a href="/" class="navbar-brand">Shop<span>Nest</span></a>
    <ul class="navbar-nav">
      <li><a href="/">Home</a></li>
      <li><a href="/shop">Shop</a></li>
      <li><a href="/orders/my-orders">My Orders</a></li>
    </ul>
  </div>
</nav>

<div class="success-page">
  <div class="success-card" th:if="${order}">
    <div class="success-icon">🎉</div>
    <h2>Order Placed!</h2>
    <p style="color:#666;margin-bottom:1rem;">Thank you for your purchase. Your order has been confirmed.</p>

    <div class="order-details">
      <div class="order-detail-row">
        <strong>Order ID</strong>
        <span th:text="'#' + ${order.id}"></span>
      </div>
      <div class="order-detail-row">
        <strong>Transaction ID</strong>
        <span th:text="${order.transactionId}" style="font-family:monospace;font-size:0.85rem;"></span>
      </div>
      <div class="order-detail-row">
        <strong>Payment Method</strong>
        <span th:text="${order.paymentMethod}"></span>
      </div>
      <div class="order-detail-row">
        <strong>Payment Status</strong>
        <span style="color:#28a745;font-weight:600;" th:text="${order.paymentStatus}"></span>
      </div>
      <div class="order-detail-row">
        <strong>Order Status</strong>
        <span style="color:#2563eb;font-weight:600;" th:text="${order.status}"></span>
      </div>
      <div class="order-detail-row">
        <strong>Total Amount</strong>
        <span style="font-weight:700;color:#e94560;" th:text="'₹' + ${#numbers.formatDecimal(order.totalAmount,1,'COMMA',0,'POINT')}"></span>
      </div>
      <div class="order-detail-row">
        <strong>Shipping To</strong>
        <span th:text="${order.shippingAddress}" style="max-width:200px;text-align:right;font-size:0.85rem;"></span>
      </div>
    </div>

    <div style="display:flex;gap:1rem;margin-top:1.5rem;">
      <a href="/orders/my-orders" class="btn-primary" style="flex:1;justify-content:center;">
        <i class="fas fa-box"></i> View Orders
      </a>
      <a href="/shop" class="btn-outline" style="flex:1;text-align:center;color:#1a1a2e;border-color:#1a1a2e;padding:0.85rem 1rem;border-radius:50px;font-weight:600;text-decoration:none;">
        Continue Shopping
      </a>
    </div>
  </div>
</div>

<script th:src="@{/js/main.js}"></script>
</body>
</html>
