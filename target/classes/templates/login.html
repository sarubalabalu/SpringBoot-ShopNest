<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Login - ShopNest</title>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <h1><a href="/" style="text-decoration:none;color:inherit;">Shop<span>Nest</span></a></h1>
      <p>Welcome back! Sign in to continue.</p>
    </div>

    <div th:if="${error}" class="alert alert-danger">
      <i class="fas fa-exclamation-circle"></i> <span th:text="${error}">Error</span>
    </div>
    <div th:if="${message}" class="alert alert-success">
      <i class="fas fa-check-circle"></i> <span th:text="${message}">Message</span>
    </div>
    <div th:if="${param.logout}" class="alert alert-info">
      <i class="fas fa-info-circle"></i> You have been logged out successfully.
    </div>

    <form th:action="@{/login}" method="post">
      <div class="form-group">
        <label for="username"><i class="fas fa-envelope"></i> Email Address</label>
        <input type="email" id="username" name="username" placeholder="Enter your email" required/>
      </div>
      <div class="form-group">
        <label for="password"><i class="fas fa-lock"></i> Password</label>
        <input type="password" id="password" name="password" placeholder="Enter your password" required/>
      </div>
      <button type="submit" class="btn-submit">
        <i class="fas fa-sign-in-alt"></i> Sign In
      </button>
    </form>

    <div class="auth-footer">
      <p>Don't have an account? <a href="/register">Create one free</a></p>
    </div>

    <div style="margin-top:1.5rem; padding:1rem; background:#f8f9fa; border-radius:10px; font-size:0.82rem; color:#666;">
      <strong>Demo Credentials:</strong><br/>
      Admin: admin@shopnest.com / admin123<br/>
      User: user@shopnest.com / user123
    </div>
  </div>
</div>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
