<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Checkout - ShopNest</title>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body>

<nav class="navbar">
  <div class="navbar-inner">
    <a href="/" class="navbar-brand">Shop<span>Nest</span></a>
    <ul class="navbar-nav">
      <li><a href="/">Home</a></li>
      <li><a href="/shop">Shop</a></li>
      <li>
        <a href="/cart" class="cart-btn">
          <i class="fas fa-shopping-cart"></i> Cart
          <span class="cart-badge" th:text="${cartCount ?: 0}">0</span>
        </a>
      </li>
    </ul>
  </div>
</nav>

<div class="page-container">
  <h1 class="page-title"><i class="fas fa-credit-card"></i> Checkout</h1>

  <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

  <form th:action="@{/orders/place}" method="post">
    <div class="checkout-layout">
      <div>
        <!-- Shipping Address -->
        <div class="card-box">
          <h3><i class="fas fa-map-marker-alt" style="color:#e94560;"></i> Shipping Address</h3>
          <div class="form-group">
            <label>Full Name</label>
            <input type="text" th:value="${user.name}" readonly style="background:#f8f9fa;"/>
          </div>
          <div class="form-group">
            <label>Delivery Address *</label>
            <textarea name="shippingAddress" rows="3" required placeholder="Enter your complete address including city, state & PIN code"
                      style="width:100%;padding:0.8rem 1rem;border:2px solid #e0e0e0;border-radius:10px;font-family:'DM Sans',sans-serif;resize:vertical;outline:none;"
                      th:text="${user.address}"></textarea>
          </div>
          <div class="form-group">
            <label>Phone</label>
            <input type="text" th:value="${user.phone}" readonly style="background:#f8f9fa;"
                   th:placeholder="${user.phone ?: 'Not provided'}"/>
          </div>
        </div>

        <!-- Payment Method -->
        <div class="card-box">
          <h3><i class="fas fa-wallet" style="color:#e94560;"></i> Payment Method</h3>
          <div class="payment-methods">
            <div class="payment-option selected">
              <input type="radio" name="paymentMethod" value="UPI" id="upi" checked/>
              <span class="payment-icon">📱</span>
              <label for="upi">UPI Payment (GPay, PhonePe, Paytm)</label>
            </div>
            <div class="payment-option">
              <input type="radio" name="paymentMethod" value="CREDIT_CARD" id="cc"/>
              <span class="payment-icon">💳</span>
              <label for="cc">Credit Card</label>
            </div>
            <div class="payment-option">
              <input type="radio" name="paymentMethod" value="DEBIT_CARD" id="dc"/>
              <span class="payment-icon">🏦</span>
              <label for="dc">Debit Card</label>
            </div>
            <div class="payment-option">
              <input type="radio" name="paymentMethod" value="NET_BANKING" id="nb"/>
              <span class="payment-icon">🌐</span>
              <label for="nb">Net Banking</label>
            </div>
            <div class="payment-option">
              <input type="radio" name="paymentMethod" value="COD" id="cod"/>
              <span class="payment-icon">💵</span>
              <label for="cod">Cash on Delivery</label>
            </div>
          </div>

          <!-- Card Details (shown for card payments) -->
          <div id="card-fields" style="display:none;margin-top:1.5rem;">
            <div class="form-group">
              <label>Card Number</label>
              <input type="text" id="cardNumber" placeholder="1234 5678 9012 3456" maxlength="19"/>
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
              <div class="form-group">
                <label>Expiry Date</label>
                <input type="text" id="expiry" placeholder="MM/YY" maxlength="5"/>
              </div>
              <div class="form-group">
                <label>CVV</label>
                <input type="password" placeholder="•••" maxlength="3"/>
              </div>
            </div>
            <div class="form-group">
              <label>Cardholder Name</label>
              <input type="text" placeholder="Name on card"/>
            </div>
          </div>
        </div>
      </div>

      <!-- Order Summary -->
      <div>
        <div class="order-summary" style="position:sticky;top:80px;">
          <h3>Order Summary</h3>
          <div th:each="item : ${cart.items}" class="summary-row" style="align-items:center;">
            <div style="display:flex;align-items:center;gap:0.6rem;max-width:200px;">
              <img th:src="${item.product.imageUrl}" style="width:36px;height:36px;object-fit:cover;border-radius:6px;"
                   onerror="this.src='https://via.placeholder.com/36x36'"/>
              <span th:text="${item.product.name}" style="font-size:0.82rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"></span>
            </div>
            <span th:text="'x' + ${item.quantity}" style="color:#999;font-size:0.85rem;"></span>
            <span th:text="'₹' + ${#numbers.formatDecimal(item.subtotal,1,'COMMA',0,'POINT')}"></span>
          </div>
          <div class="summary-row">
            <span>Subtotal</span>
            <span th:text="'₹' + ${#numbers.formatDecimal(cart.total,1,'COMMA',0,'POINT')}"></span>
          </div>
          <div class="summary-row">
            <span>Shipping</span>
            <span style="color:#28a745;font-weight:600;">FREE</span>
          </div>
          <div class="summary-row">
            <span>Tax (GST 18%)</span>
            <span th:text="'₹' + ${#numbers.formatDecimal(cart.total * 0.18,1,'COMMA',0,'POINT')}"></span>
          </div>
          <div class="summary-row total">
            <span>Grand Total</span>
            <span th:text="'₹' + ${#numbers.formatDecimal(cart.total * 1.18,1,'COMMA',0,'POINT')}"></span>
          </div>

          <button type="submit" class="checkout-btn">
            <i class="fas fa-lock"></i> Place Order
          </button>
          <div style="text-align:center;margin-top:0.8rem;font-size:0.78rem;color:#999;">
            <i class="fas fa-shield-alt"></i> 100% Secure Payment • Money-back Guarantee
          </div>
        </div>
      </div>
    </div>
  </form>
</div>

<script th:src="@{/js/main.js}"></script>
</body>
</html>
