<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>My Orders - ShopNest</title>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body>

<nav class="navbar">
  <div class="navbar-inner">
    <a href="/" class="navbar-brand">Shop<span>Nest</span></a>
    <ul class="navbar-nav">
      <li><a href="/">Home</a></li>
      <li><a href="/shop">Shop</a></li>
      <li><a href="/orders/my-orders">My Orders</a></li>
      <li><a href="/logout">Logout</a></li>
      <li>
        <a href="/cart" class="cart-btn">
          <i class="fas fa-shopping-cart"></i> Cart
          <span class="cart-badge" th:text="${cartCount ?: 0}">0</span>
        </a>
      </li>
    </ul>
  </div>
</nav>

<div class="page-container">
  <h1 class="page-title"><i class="fas fa-box"></i> My Orders</h1>

  <div th:if="${#lists.isEmpty(orders)}" style="text-align:center;padding:4rem;background:white;border-radius:16px;">
    <i class="fas fa-box-open" style="font-size:4rem;color:#ddd;margin-bottom:1rem;display:block;"></i>
    <h3 style="color:#999;margin-bottom:1rem;">No orders yet</h3>
    <a href="/shop" class="btn-primary">Start Shopping</a>
  </div>

  <div th:each="order : ${orders}" class="card-box" style="margin-bottom:1.5rem;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;flex-wrap:wrap;gap:0.5rem;">
      <div>
        <span style="font-weight:700;font-size:1rem;">Order #<span th:text="${order.id}"></span></span>
        <span style="color:#999;font-size:0.85rem;margin-left:1rem;"
              th:text="${#temporals.format(order.createdAt, 'dd MMM yyyy, hh:mm a')}"></span>
      </div>
      <div style="display:flex;gap:0.7rem;align-items:center;">
        <span th:text="${order.status}"
              style="padding:0.3rem 0.9rem;border-radius:20px;font-size:0.8rem;font-weight:700;"
              th:style="${order.status == 'CONFIRMED'} ? 'background:#dbeafe;color:#1d4ed8;' :
                        (${order.status == 'DELIVERED'} ? 'background:#dcfce7;color:#16a34a;' :
                        'background:#fef9c3;color:#ca8a04;')"></span>
        <span th:text="${order.paymentStatus}"
              style="padding:0.3rem 0.9rem;border-radius:20px;font-size:0.8rem;font-weight:700;"
              th:style="${order.paymentStatus == 'PAID'} ? 'background:#dcfce7;color:#16a34a;' : 'background:#fee2e2;color:#dc2626;'"></span>
      </div>
    </div>

    <div th:each="item : ${order.items}" style="display:flex;gap:1rem;align-items:center;padding:0.8rem 0;border-bottom:1px solid #f0f0f0;">
      <img th:src="${item.product.imageUrl}" style="width:60px;height:60px;object-fit:cover;border-radius:8px;"
           onerror="this.src='https://via.placeholder.com/60x60?text=P'"/>
      <div style="flex:1;">
        <div style="font-weight:600;font-size:0.95rem;" th:text="${item.product.name}"></div>
        <div style="font-size:0.82rem;color:#999;">Qty: <span th:text="${item.quantity}"></span></div>
      </div>
      <div style="font-weight:700;" th:text="'₹' + ${#numbers.formatDecimal(item.subtotal,1,'COMMA',0,'POINT')}"></div>
    </div>

    <div style="display:flex;justify-content:space-between;align-items:center;padding-top:1rem;">
      <div>
        <span style="font-size:0.85rem;color:#666;">Payment: </span>
        <span style="font-weight:600;font-size:0.85rem;" th:text="${order.paymentMethod}"></span>
        &nbsp;|&nbsp;
        <span style="font-size:0.82rem;color:#999;font-family:monospace;" th:text="${order.transactionId}"></span>
      </div>
      <div style="font-size:1.15rem;font-weight:800;color:#e94560;"
           th:text="'₹' + ${#numbers.formatDecimal(order.totalAmount,1,'COMMA',0,'POINT')}"></div>
    </div>
  </div>
</div>

<footer style="background:#1a1a2e;color:rgba(255,255,255,0.6);text-align:center;padding:2rem;margin-top:3rem;">
  <p>&copy; 2024 ShopNest. All rights reserved.</p>
</footer>

<script th:src="@{/js/main.js}"></script>
</body>
</html>
