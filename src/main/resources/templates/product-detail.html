<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title th:text="${product?.name + ' - ShopNest'}">Product - ShopNest</title>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body>

<nav class="navbar">
  <div class="navbar-inner">
    <a href="/" class="navbar-brand">Shop<span>Nest</span></a>
    <div class="navbar-search">
      <i class="fas fa-search search-icon"></i>
      <input type="text" placeholder="Search products…"/>
    </div>
    <ul class="navbar-nav">
      <li><a href="/">Home</a></li>
      <li><a href="/shop">Shop</a></li>
      <sec:authorize access="isAuthenticated()">
        <li><a href="/orders/my-orders">Orders</a></li>
        <li><a href="/logout">Logout</a></li>
      </sec:authorize>
      <sec:authorize access="!isAuthenticated()">
        <li><a href="/login">Login</a></li>
      </sec:authorize>
      <li>
        <a href="/cart" class="cart-btn">
          <i class="fas fa-shopping-cart"></i> Cart
          <span class="cart-badge" th:text="${cartCount ?: 0}">0</span>
        </a>
      </li>
    </ul>
  </div>
</nav>

<div class="page-container">
  <div th:if="${product}" style="display:grid;grid-template-columns:1fr 1fr;gap:3rem;margin-bottom:3rem;background:white;border-radius:16px;padding:2rem;box-shadow:0 4px 20px rgba(0,0,0,0.08);">
    <div>
      <img th:src="${product.imageUrl}" th:alt="${product.name}"
           style="width:100%;border-radius:12px;object-fit:cover;max-height:420px;"
           onerror="this.src='https://via.placeholder.com/600x400?text=Product'"/>
    </div>
    <div>
      <div style="color:#e94560;font-size:0.8rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:0.5rem;"
           th:text="${product.category}"></div>
      <h1 style="font-family:'Playfair Display',serif;font-size:1.8rem;margin-bottom:0.8rem;" th:text="${product.name}"></h1>
      <div class="product-rating" style="margin-bottom:1rem;">
        <span class="stars">
          <i th:each="i : ${#numbers.sequence(1,5)}" th:class="${i <= product.rating} ? 'fas fa-star' : 'far fa-star'"></i>
        </span>
        <span class="rating-count" th:text="'(' + ${product.reviewCount} + ' reviews)'"></span>
      </div>
      <div style="display:flex;align-items:center;gap:1rem;margin-bottom:1.5rem;">
        <span style="font-size:2rem;font-weight:800;color:#1a1a2e;"
              th:text="'₹' + ${#numbers.formatDecimal(product.price,1,'COMMA',0,'POINT')}"></span>
        <span th:if="${product.originalPrice}" style="font-size:1.2rem;color:#999;text-decoration:line-through;"
              th:text="'₹' + ${#numbers.formatDecimal(product.originalPrice,1,'COMMA',0,'POINT')}"></span>
      </div>
      <p th:text="${product.description}" style="color:#555;line-height:1.7;margin-bottom:1.5rem;"></p>
      <div style="color:#28a745;font-size:0.9rem;font-weight:600;margin-bottom:1.5rem;">
        <i class="fas fa-check-circle"></i>
        <span th:if="${product.stock > 0}">In Stock (<span th:text="${product.stock}"></span> available)</span>
        <span th:unless="${product.stock > 0}" style="color:#dc3545;">Out of Stock</span>
      </div>
      <sec:authorize access="isAuthenticated()">
        <form th:action="@{/cart/add}" method="post" style="display:flex;gap:1rem;align-items:center;">
          <input type="hidden" name="productId" th:value="${product.id}"/>
          <div style="display:flex;align-items:center;border:2px solid #e0e0e0;border-radius:10px;overflow:hidden;">
            <button type="button" onclick="changeQty(-1)" style="padding:0.7rem 1rem;background:none;border:none;cursor:pointer;font-size:1.1rem;font-weight:700;">-</button>
            <input type="number" name="quantity" id="qtyInput" value="1" min="1"
                   th:max="${product.stock}" style="width:50px;text-align:center;border:none;outline:none;font-weight:700;font-size:1rem;"/>
            <button type="button" onclick="changeQty(1)" style="padding:0.7rem 1rem;background:none;border:none;cursor:pointer;font-size:1.1rem;font-weight:700;">+</button>
          </div>
          <button type="submit" class="btn-primary" style="padding:0.8rem 2rem;">
            <i class="fas fa-cart-plus"></i> Add to Cart
          </button>
        </form>
      </sec:authorize>
      <sec:authorize access="!isAuthenticated()">
        <a href="/login" class="btn-primary" style="display:inline-flex;padding:0.85rem 2rem;">
          <i class="fas fa-sign-in-alt"></i>&nbsp; Login to Add to Cart
        </a>
      </sec:authorize>
    </div>
  </div>

  <!-- Related Products -->
  <h2 style="font-family:'Playfair Display',serif;font-size:1.6rem;margin-bottom:1.5rem;">Related <span style="color:#e94560;">Products</span></h2>
  <div class="product-grid">
    <div th:each="rp : ${relatedProducts}" class="product-card">
      <div class="product-img-wrap">
        <img th:src="${rp.imageUrl}" th:alt="${rp.name}" onerror="this.src='https://via.placeholder.com/400x300?text=Product'"/>
        <div class="product-actions">
          <a th:href="@{/product/{id}(id=${rp.id})}" class="action-btn">View</a>
        </div>
      </div>
      <div class="product-info">
        <div class="product-name" th:text="${rp.name}"></div>
        <div class="product-price">
          <span class="price-current" th:text="'₹' + ${#numbers.formatDecimal(rp.price,1,'COMMA',0,'POINT')}"></span>
        </div>
      </div>
    </div>
  </div>
</div>

<footer style="background:#1a1a2e;color:rgba(255,255,255,0.6);text-align:center;padding:2rem;">
  <p>&copy; 2024 ShopNest. All rights reserved.</p>
</footer>

<script>
  function changeQty(delta) {
    const input = document.getElementById('qtyInput');
    let val = parseInt(input.value) + delta;
    const max = parseInt(input.max) || 999;
    if (val < 1) val = 1;
    if (val > max) val = max;
    input.value = val;
  }
</script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
