<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Register - ShopNest</title>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <h1><a href="/" style="text-decoration:none;color:inherit;">Shop<span>Nest</span></a></h1>
      <p>Create your free account today.</p>
    </div>

    <div th:if="${error}" class="alert alert-danger">
      <i class="fas fa-exclamation-circle"></i> <span th:text="${error}">Error</span>
    </div>
    <div th:if="${success}" class="alert alert-success">
      <i class="fas fa-check-circle"></i> <span th:text="${success}">Success</span>
    </div>

    <form th:action="@{/register}" method="post" th:object="${user}">
      <div class="form-group">
        <label><i class="fas fa-user"></i> Full Name</label>
        <input type="text" th:field="*{name}" placeholder="Your full name" required/>
      </div>
      <div class="form-group">
        <label><i class="fas fa-envelope"></i> Email Address</label>
        <input type="email" th:field="*{email}" placeholder="your@email.com" required/>
      </div>
      <div class="form-group">
        <label><i class="fas fa-lock"></i> Password</label>
        <input type="password" th:field="*{password}" placeholder="Create a password (min. 6 chars)" required minlength="6"/>
      </div>
      <div class="form-group">
        <label><i class="fas fa-phone"></i> Phone Number <span style="color:#999;font-weight:400;">(optional)</span></label>
        <input type="tel" th:field="*{phone}" placeholder="+91 98765 43210"/>
      </div>
      <button type="submit" class="btn-submit">
        <i class="fas fa-user-plus"></i> Create Account
      </button>
    </form>

    <div class="auth-footer">
      <p>Already have an account? <a href="/login">Sign in</a></p>
    </div>
  </div>
</div>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
